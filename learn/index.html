<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1a17'/%3E%3Cpath d='M32 10v44M10 32h44' stroke='%23d4b06a' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23d4b06a'/%3E%3C/svg%3E" />
    <title>AlphaZero 五子棋教程 · 学会下棋的机器</title>
    <script>
      // anti-FOUC: apply persisted/system theme before first paint
      // (shares the "exp-theme" key with explainer/ — same user, same preference)
      try {
        var t = localStorage.getItem("exp-theme")
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
